<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="7805"><svg id="01 · Navigation" x="0" y="0" width="1440" height="87" overflow="visible"><g id="01 · Navigation · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="87" fill="#D6D0C8"/><rect x="1289" y="0" width="1" height="87" fill="#D6D0C8"/><rect x="0" y="86" width="1440" height="1" fill="#D6D0C8"/></g><g id="01 · Navigation · jointures" transform="translate(0 0)"><circle cx="150.5" cy="86.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="86.5" r="4" fill="#FFFFFF"/></g><text id="Nav · texte" x="182" y="48" font-family="Inter-Medium" font-size="16" fill="#262626" text-anchor="start">Pointé    Produit · Agents · Sécurité · Tarifs · Cabinets        [Se connecter] [Essayer gratuitement]</text></svg><svg id="02 · Hero" x="0" y="87" width="1440" height="1121" overflow="visible"><g id="02 · Hero · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="1121" fill="#D6D0C8"/><rect x="1289" y="0" width="1" height="1121" fill="#D6D0C8"/><rect x="0" y="1120" width="1440" height="1" fill="#D6D0C8"/></g><g id="02 · Hero · jointures" transform="translate(0 0)"><circle cx="150.5" cy="1120.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="1120.5" r="4" fill="#FFFFFF"/></g><text id="Hero · réf" x="1274" y="31" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="end">RÉF. HERO CENTRÉ 6072:8 (CLONÉ)</text><svg id="Hero · badge" x="545" y="80" width="350" height="40" overflow="visible"><text id="Hero · badge · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">BADGE</text></svg><text id="Hero · titre" x="720" y="198" font-family="Inter-SemiBold" font-size="48" fill="#1A1A1A" text-anchor="middle">Votre mois se clôture tout seul, ligne par ligne.</text><text id="Hero · texte" x="720" y="297" font-family="Inter-Medium" font-size="17" fill="#595959" text-anchor="middle">Pointé lit vos relevés, retrouve chaque facture dans vos mails et relance celles qui manquent. Votre comptable reçoit un mois propre, sans rien vous demander.</text><svg id="Hero · boutons" x="520" y="374" width="400" height="47" overflow="visible"><text id="Hero · boutons · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">VOIR UNE DÉMO · CONNECTER MA BANQUE</text></svg><svg id="Hero · motif gauche" x="151" y="0" width="285" height="700" overflow="visible"><text id="Hero · motif gauche · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">MOTIF DE TUILES + LUMIÈRE (MIROIR)</text></svg><svg id="Hero · motif droit" x="1004" y="0" width="285" height="700" overflow="visible"><text id="Hero · motif droit · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">MOTIF DE TUILES + LUMIÈRE</text></svg><svg id="Hero · fenêtre" x="343" y="463" width="754" height="612" overflow="visible"><text id="Hero · fenêtre · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">FENÊTRE DE SITE 6075:389 · ILLUSTRATION DE DÉMO</text><text id="Hero · fenêtre · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">Le relevé de novembre. Une ligne « Orange Pro · 59,90 € » reçoit sa facture. Curseur « Agent Pointé » dépose la facture, curseur « Julie, comptable » regarde. INFO CLÉ : la ligne passe à « Pointée ».</text></svg></svg><svg id="03 · Preuve" x="0" y="1208" width="1440" height="200" overflow="visible"><g id="03 · Preuve · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="200" fill="#D6D0C8"/><rect x="1289" y="0" width="1" height="200" fill="#D6D0C8"/><rect x="0" y="199" width="1440" height="1" fill="#D6D0C8"/></g><g id="03 · Preuve · jointures" transform="translate(0 0)"><circle cx="150.5" cy="199.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="199.5" r="4" fill="#FFFFFF"/></g><text id="Preuve · réf" x="1274" y="23" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="end">RÉF. BANDEAU « TRUSTED BY » 6086:208 · GRILLE DE 2</text><svg id="Preuve · case gauche" x="166" y="40" width="538" height="130" overflow="visible"><text id="Preuve · case gauche · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">CASE 1 · CHIFFRE</text><text id="Preuve · case gauche · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">ILS CLÔTURENT AVEC POINTÉ · 1 200 entreprises · 4,8/5</text></svg><svg id="Preuve · case droite" x="736" y="40" width="538" height="130" overflow="visible"><text id="Preuve · case droite · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">CASE 2 · NOMS DE CLIENTS (TEXTE, FICTIFS)</text><text id="Preuve · case droite · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">Atelier Nord · Maison Lune · Ardent · Bâtir &amp; Co · Studio Ferro · Les Bureaux Verts</text></svg></svg><svg id="04 · Les agents" x="0" y="1408" width="1440" height="1000" overflow="visible"><g id="04 · Les agents · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="1000" fill="#D6D0C8"/><rect x="1289" y="0" width="1" height="1000" fill="#D6D0C8"/><rect x="0" y="999" width="1440" height="1" fill="#D6D0C8"/></g><g id="04 · Les agents · jointures" transform="translate(0 0)"><circle cx="150.5" cy="999.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="999.5" r="4" fill="#FFFFFF"/></g><text id="Agents · sur-titre" x="720" y="114" font-family="DMMono-Medium" font-size="14" fill="#3745F1" text-anchor="middle">LES AGENTS</text><text id="Agents · titre" x="720" y="178" font-family="Inter-SemiBold" font-size="48" fill="#1A1A1A" text-anchor="middle">Deux agents font le travail que personne n'aime faire</text><text id="Agents · intro" x="720" y="293" font-family="Inter-Medium" font-size="17" fill="#595959" text-anchor="middle">Ils travaillent la nuit, sur vos vrais comptes, et ne vous écrivent que quand il faut décider.</text><text id="Agents · réf" x="1274" y="41" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="end">RÉF. BENTO 6086:190 · GRILLE DE 2 + MOTIF + LUMIÈRE</text><svg id="Agents · carte 1" x="166" y="380" width="538" height="580" overflow="visible"><svg id="Agents · illustration 1" x="12" y="12" width="514" height="380" overflow="visible"><text id="Agents · illustration 1 · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">ZONE ILLUSTRATION</text><text id="Agents · illustration 1 · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">ILLUSTRATION : une ligne de banque reliée par un câble à sa facture. INFO CLÉ : « Facture trouvée ».</text></svg><text id="Agents · texte 1" x="28" y="436" font-family="Inter-Medium" font-size="16" fill="#595959" text-anchor="start">Le rapprochement · Chaque paiement retrouve sa facture, dans vos mails, votre Drive ou vos espaces fournisseurs.</text></svg><svg id="Agents · carte 2" x="736" y="380" width="538" height="580" overflow="visible"><svg id="Agents · illustration 2" x="12" y="12" width="514" height="380" overflow="visible"><text id="Agents · illustration 2 · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">ZONE ILLUSTRATION</text><text id="Agents · illustration 2 · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">ILLUSTRATION : un message parti vers Marc (commercial). INFO CLÉ : « Relance envoyée ».</text></svg><text id="Agents · texte 2" x="28" y="436" font-family="Inter-Medium" font-size="16" fill="#595959" text-anchor="start">La relance · Un justificatif manque ? L'agent écrit à la bonne personne, au bon moment, et range la réponse.</text></svg></svg><svg id="05 · La clôture" x="0" y="2408" width="1440" height="1020" overflow="visible"><g id="05 · La clôture · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="1020" fill="#D6D0C8"/><rect x="1289" y="0" width="1" height="1020" fill="#D6D0C8"/><rect x="0" y="1019" width="1440" height="1" fill="#D6D0C8"/></g><g id="05 · La clôture · jointures" transform="translate(0 0)"><circle cx="150.5" cy="1019.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="1019.5" r="4" fill="#FFFFFF"/></g><text id="Clôture · sur-titre" x="720" y="114" font-family="DMMono-Medium" font-size="14" fill="#3745F1" text-anchor="middle">LA CLÔTURE</text><text id="Clôture · titre" x="720" y="178" font-family="Inter-SemiBold" font-size="48" fill="#1A1A1A" text-anchor="middle">Le 5 du mois, tout est déjà chez votre comptable</text><text id="Clôture · intro" x="720" y="293" font-family="Inter-Medium" font-size="17" fill="#595959" text-anchor="middle">Pointé prépare l'export au format de votre cabinet et l'envoie dès que la dernière ligne est pointée.</text><text id="Clôture · réf" x="1274" y="41" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="end">RÉF. ONGLETS + GRANDE CARTE 6086:199</text><svg id="Clôture · onglets" x="400" y="370" width="640" height="52" overflow="visible"><text id="Clôture · onglets · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">ONGLETS · RAPPROCHEMENT · RELANCES · TVA · [EXPORT COMPTABLE]</text></svg><svg id="Clôture · case texte" x="166" y="460" width="538" height="500" overflow="visible"><text id="Clôture · case texte · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">CASE 1 · TEXTE + 2 CHIFFRES</text><text id="Clôture · case texte · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">Un export que votre cabinet accepte tel quel. FEC, Pennylane, Tiime ou Excel. [Voir les formats]. 3 h gagnées chaque mois · 5 jours de clôture en moins.</text></svg><svg id="Clôture · case illustration" x="736" y="460" width="538" height="500" overflow="visible"><text id="Clôture · case illustration · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">CASE 2 · ILLUSTRATION</text><text id="Clôture · case illustration · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">Le dossier « Novembre 2026 · 214 lignes » relié par un câble au cabinet. INFO CLÉ : « Envoyé au cabinet ».</text></svg></svg><svg id="06 · Sécurité" x="0" y="3428" width="1440" height="920" overflow="visible"><g id="06 · Sécurité · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="920" fill="#333333"/><rect x="1289" y="0" width="1" height="920" fill="#333333"/><rect x="0" y="919" width="1440" height="1" fill="#333333"/></g><g id="06 · Sécurité · jointures" transform="translate(0 0)"><circle cx="150.5" cy="919.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="919.5" r="4" fill="#FFFFFF"/></g><text id="Sécurité · sur-titre" x="720" y="114" font-family="DMMono-Medium" font-size="14" fill="#3745F1" text-anchor="middle">SÉCURITÉ</text><text id="Sécurité · titre" x="720" y="178" font-family="Inter-SemiBold" font-size="48" fill="#FBFAF9" text-anchor="middle">Les agents lisent vos comptes. Ils ne paient jamais.</text><text id="Sécurité · intro" x="720" y="293" font-family="Inter-Medium" font-size="17" fill="#A3A3A3" text-anchor="middle">Pointé se connecte à votre banque en lecture seule, par un agrégateur agréé. Aucun virement ne peut partir d'ici.</text><text id="Sécurité · réf" x="1274" y="41" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="end">RÉF. BLOC SOMBRE 6086:166 · 4 CASES</text><svg id="Sécurité · illustration" x="343" y="340" width="754" height="300" overflow="visible"><text id="Sécurité · illustration · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#4F5CF2" text-anchor="start">ILLUSTRATION (CHUTE SOMBRE + HALO SOUS LE VERROU)</text><text id="Sécurité · illustration · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#E5E1DC" text-anchor="start">Banque à gauche, agents à droite, entre les deux un verrou en verre. INFO CLÉ : « Lecture seule ».</text></svg><svg id="Sécurité · case 1" x="166" y="700" width="253" height="160" overflow="visible"><text id="Sécurité · case 1 · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#4F5CF2" text-anchor="start">CASE 1</text><text id="Sécurité · case 1 · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#E5E1DC" text-anchor="start">Lecture seule</text></svg><svg id="Sécurité · case 2" x="451" y="700" width="253" height="160" overflow="visible"><text id="Sécurité · case 2 · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#4F5CF2" text-anchor="start">CASE 2</text><text id="Sécurité · case 2 · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#E5E1DC" text-anchor="start">Agrégateur agréé</text></svg><svg id="Sécurité · case 3" x="736" y="700" width="253" height="160" overflow="visible"><text id="Sécurité · case 3 · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#4F5CF2" text-anchor="start">CASE 3</text><text id="Sécurité · case 3 · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#E5E1DC" text-anchor="start">Hébergé en France</text></svg><svg id="Sécurité · case 4" x="1021" y="700" width="253" height="160" overflow="visible"><text id="Sécurité · case 4 · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#4F5CF2" text-anchor="start">CASE 4</text><text id="Sécurité · case 4 · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#E5E1DC" text-anchor="start">Coupé en un clic</text></svg></svg><svg id="07 · Avis" x="0" y="4348" width="1440" height="500" overflow="visible"><g id="07 · Avis · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="500" fill="#D6D0C8"/><rect x="1289" y="0" width="1" height="500" fill="#D6D0C8"/><rect x="0" y="499" width="1440" height="1" fill="#D6D0C8"/></g><g id="07 · Avis · jointures" transform="translate(0 0)"><circle cx="150.5" cy="499.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="499.5" r="4" fill="#FFFFFF"/></g><text id="Avis · réf" x="1274" y="23" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="end">GRILLE DE 2 · GUILLEMETS 6070:7</text><svg id="Avis · citation" x="166" y="60" width="538" height="380" overflow="visible"><text id="Avis · citation · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">CASE 1 · CITATION (GUILLEMETS OFFICIELS)</text><text id="Avis · citation · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">« Avant, je passais le premier week-end du mois à chercher des tickets. Maintenant, je reçois un message quand il en manque un, et c'est tout. » Sarah Benali, gérante de Maison Lune</text></svg><svg id="Avis · chiffres" x="736" y="60" width="538" height="380" overflow="visible"><text id="Avis · chiffres · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">CASE 2 · DEUX CHIFFRES</text><text id="Avis · chiffres · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">98 % des lignes pointées sans vous · 3 h rendues chaque mois</text></svg></svg><svg id="08 · FAQ" x="0" y="4848" width="1440" height="1057" overflow="visible"><g id="08 · FAQ · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="1057" fill="#D6D0C8"/><rect x="1289" y="0" width="1" height="1057" fill="#D6D0C8"/><rect x="0" y="1056" width="1440" height="1" fill="#D6D0C8"/></g><g id="08 · FAQ · jointures" transform="translate(0 0)"><circle cx="150.5" cy="1056.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="1056.5" r="4" fill="#FFFFFF"/></g><text id="FAQ · réf" x="1274" y="23" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="end">FAQ 6058:1391 (CLONÉE, TEXTES REMPLACÉS)</text><svg id="FAQ · bloc" x="247" y="100" width="946" height="860" overflow="visible"><text id="FAQ · bloc · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">FAQ</text><text id="FAQ · bloc · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">Ce qu'on nous demande avant de connecter sa banque. Ouverte : Pointé peut-il faire un virement ? Non, lecture seule.</text></svg></svg><svg id="09 · Appel final" x="0" y="5905" width="1440" height="860" overflow="visible"><g id="09 · Appel final · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="860" fill="#D6D0C8"/><rect x="1289" y="0" width="1" height="860" fill="#D6D0C8"/><rect x="0" y="859" width="1440" height="1" fill="#D6D0C8"/></g><g id="09 · Appel final · jointures" transform="translate(0 0)"><circle cx="150.5" cy="859.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="859.5" r="4" fill="#FFFFFF"/></g><text id="Appel · réf" x="1274" y="23" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="end">RÉF. « ANY APP. ANYWHERE. » 6086:205</text><text id="Appel · titre" x="720" y="168" font-family="Inter-SemiBold" font-size="48" fill="#1A1A1A" text-anchor="middle">Votre banque. Vos factures. Un mois propre.</text><svg id="Appel · tuiles" x="270" y="300" width="900" height="300" overflow="visible"><text id="Appel · tuiles · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">TUILES DES OUTILS RELIÉS EN PERSPECTIVE (NOMS EN TEXTE)</text><text id="Appel · tuiles · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">Qonto · Shine · BNP · Gmail · Outlook · Drive · Pennylane · Tiime</text></svg><svg id="Appel · barre" x="360" y="640" width="720" height="64" overflow="visible"><text id="Appel · barre · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#3745F1" text-anchor="start">BARRE SOMBRE + BOUTON</text><text id="Appel · barre · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#595959" text-anchor="start">Connectez votre banque en deux minutes · Essayer gratuitement</text></svg><text id="Appel · garanties" x="720" y="745" font-family="Inter-Medium" font-size="15" fill="#707070" text-anchor="middle">Gratuit 30 jours · Lecture seule · Données en France</text></svg><svg id="10 · Pied de page" x="0" y="6765" width="1440" height="1040" overflow="visible"><g id="10 · Pied de page · rails" transform="translate(0 0)"><rect x="150" y="0" width="1" height="1040" fill="#333333"/><rect x="1289" y="0" width="1" height="1040" fill="#333333"/><rect x="0" y="1039" width="1440" height="1" fill="#333333"/></g><g id="10 · Pied de page · jointures" transform="translate(0 0)"><circle cx="150.5" cy="1039.5" r="4" fill="#FFFFFF"/><circle cx="1289.5" cy="1039.5" r="4" fill="#FFFFFF"/></g><svg id="Pied · bloc" x="166" y="80" width="1108" height="860" overflow="visible"><text id="Pied · bloc · intitulé" x="20" y="27" font-family="DMMono-Medium" font-size="11" fill="#4F5CF2" text-anchor="start">PIED DE PAGE 6058:1493 (CLONÉ, SANS LES PIXELS)</text><text id="Pied · bloc · détail" x="20" y="54" font-family="Inter-Medium" font-size="14" fill="#E5E1DC" text-anchor="start">Le mois prochain se clôture sans vous. Lettre du dirigeant. Colonnes Produit / Ressources / Entreprise. Logotype géant « Pointé ».</text></svg></svg></svg>