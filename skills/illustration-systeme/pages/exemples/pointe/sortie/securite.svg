<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920"><g id="Sécurité · rail g" transform="translate(0 0)"><rect x="150" y="0" width="1" height="920" fill="#333333"/></g><g id="Sécurité · rail d" transform="translate(0 0)"><rect x="1289" y="0" width="1" height="920" fill="#333333"/></g><text id="Sécurité · sur-titre" x="720" y="114" font-family="DMMono-Medium" font-size="14" fill="#4F5CF2" text-anchor="middle">SÉCURITÉ</text><text id="Sécurité · titre" x="720" y="180" font-family="Inter-SemiBold" font-size="48" fill="#FBFAF9" text-anchor="middle">Les agents lisent vos comptes. Ils ne paient jamais.</text><text id="Sécurité · intro" x="720" y="277" font-family="Inter-Medium" font-size="17" fill="#D6D0C8" text-anchor="middle">Pointé se connecte à votre banque en lecture seule, par un agrégateur agréé. Aucun virement ne peut partir d'ici.</text><svg id="Sécurité · illustration" x="343" y="360" width="754" height="280" overflow="visible"><svg id="Sécurité · Banque" x="40" y="100" width="190" height="80" overflow="visible"><svg id="Sécurité · Banque · icône" x="16" y="20" width="40" height="40" overflow="visible"><g id="Sécurité · Banque · glyphe" transform="translate(12 14)"><rect x="0" y="0" width="16" height="12" rx="2" fill="none" stroke="#D6D0C8" stroke-width="1.6"/><path d="M0 4h16" stroke="#D6D0C8" stroke-width="1.6"/></g></svg><text id="Sécurité · Banque · titre" x="68" y="34" font-family="Inter-SemiBold" font-size="14" fill="#FBFAF9" text-anchor="start">Votre banque</text><text id="Sécurité · Banque · détail" x="68" y="53" font-family="Inter-Medium" font-size="12" fill="#707070" text-anchor="start">Compte pro</text></svg><svg id="Sécurité · Agents" x="524" y="100" width="190" height="80" overflow="visible"><svg id="Sécurité · Agents · icône" x="16" y="20" width="40" height="40" overflow="visible"><g id="Sécurité · Agents · glyphe" transform="translate(12 12)"><path d="M4.5 8.2l2.3 2.3 4.7-4.9" fill="none" stroke="#D6D0C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg><text id="Sécurité · Agents · titre" x="68" y="34" font-family="Inter-SemiBold" font-size="14" fill="#FBFAF9" text-anchor="start">Agents Pointé</text><text id="Sécurité · Agents · détail" x="68" y="53" font-family="Inter-Medium" font-size="12" fill="#707070" text-anchor="start">Lecture des opérations</text></svg><g id="Sécurité · liaisons" transform="translate(0 0)"><path d="M230 140H330M424 140H524" stroke="#404040" stroke-width="2"/><path d="M424 140H524" stroke="#4F5CF2" stroke-width="2" stroke-dasharray="0"/></g><svg id="Sécurité · verrou" x="330" y="94" width="94" height="94" overflow="visible"><g id="Sécurité · verrou · cadenas" transform="translate(35 33)"><rect x="5" y="10" width="14" height="11" rx="3" fill="none" stroke="#FBFAF9" stroke-width="1.8"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10" fill="none" stroke="#FBFAF9" stroke-width="1.8" stroke-linecap="round"/></g></svg><svg id="Sécurité · Lecture seule" x="309" y="208" width="136" height="34" overflow="visible"><g id="Sécurité · Lecture seule · cadenas" transform="translate(12 9)"><rect transform="scale(.7)" x="5" y="10" width="14" height="11" rx="3" fill="none" stroke="#1A1A1A" stroke-width="1.8"/><path transform="scale(.7)" d="M8 10V7.5a4 4 0 0 1 8 0V10" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/></g><text id="Sécurité · Lecture seule · texte" x="34" y="21" font-family="Inter-SemiBold" font-size="14" fill="#1A1A1A" text-anchor="start">Lecture seule</text></svg></svg><g id="Sécurité · trait cases" transform="translate(0 0)"><rect x="150" y="680" width="1140" height="1" fill="#333333"/></g><text id="Sécurité · case 1 · titre" x="182" y="736" font-family="Inter-SemiBold" font-size="20" fill="#FBFAF9" text-anchor="start">Lecture seule</text><text id="Sécurité · case 1 · texte" x="182" y="765" font-family="Inter-Medium" font-size="15" fill="#D6D0C8" text-anchor="start">Voir les opérations, jamais les modifier.</text><g id="Sécurité · séparateur 1" transform="translate(0 0)"><rect x="435" y="680" width="1" height="240" fill="#333333"/></g><svg id="Sécurité · jointure 1" x="431" y="676" width="8" height="8" overflow="visible"></svg><text id="Sécurité · case 2 · titre" x="467" y="736" font-family="Inter-SemiBold" font-size="20" fill="#FBFAF9" text-anchor="start">Agrégateur agréé</text><text id="Sécurité · case 2 · texte" x="467" y="765" font-family="Inter-Medium" font-size="15" fill="#D6D0C8" text-anchor="start">Connexion DSP2, sans partager vos codes.</text><g id="Sécurité · séparateur 2" transform="translate(0 0)"><rect x="720" y="680" width="1" height="240" fill="#333333"/></g><svg id="Sécurité · jointure 2" x="716" y="676" width="8" height="8" overflow="visible"></svg><text id="Sécurité · case 3 · titre" x="752" y="736" font-family="Inter-SemiBold" font-size="20" fill="#FBFAF9" text-anchor="start">Hébergé en France</text><text id="Sécurité · case 3 · texte" x="752" y="765" font-family="Inter-Medium" font-size="15" fill="#D6D0C8" text-anchor="start">Données chiffrées, serveurs à Paris.</text><g id="Sécurité · séparateur 3" transform="translate(0 0)"><rect x="1005" y="680" width="1" height="240" fill="#333333"/></g><svg id="Sécurité · jointure 3" x="1001" y="676" width="8" height="8" overflow="visible"></svg><text id="Sécurité · case 4 · titre" x="1037" y="736" font-family="Inter-SemiBold" font-size="20" fill="#FBFAF9" text-anchor="start">Coupé en un clic</text><text id="Sécurité · case 4 · texte" x="1037" y="765" font-family="Inter-Medium" font-size="15" fill="#D6D0C8" text-anchor="start">Vous retirez l'accès quand vous voulez.</text><svg id="Sécurité · jointure g" x="146" y="676" width="8" height="8" overflow="visible"></svg><svg id="Sécurité · jointure d" x="1286" y="676" width="8" height="8" overflow="visible"></svg><g id="Sécurité · trait de fin" transform="translate(0 0)"><rect x="0" y="919" width="1440" height="1" fill="#333333"/></g><svg id="Sécurité · jointure 150" x="146" y="915.5" width="8" height="8" overflow="visible"></svg><svg id="Sécurité · jointure 1290" x="1286" y="915.5" width="8" height="8" overflow="visible"></svg><svg id="Sécurité · jointure 435" x="431" y="915.5" width="8" height="8" overflow="visible"></svg><svg id="Sécurité · jointure 720" x="716" y="915.5" width="8" height="8" overflow="visible"></svg><svg id="Sécurité · jointure 1005" x="1001" y="915.5" width="8" height="8" overflow="visible"></svg></svg>