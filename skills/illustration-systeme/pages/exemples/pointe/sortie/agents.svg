<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000"><text id="Agents · sur-titre" x="720" y="114" font-family="DMMono-Medium" font-size="14" fill="#3745F1" text-anchor="middle">LES AGENTS</text><text id="Agents · titre" x="720" y="180" font-family="Inter-SemiBold" font-size="48" fill="#1A1A1A" text-anchor="middle">Deux agents font le travail que personne n'aime faire</text><text id="Agents · intro" x="720" y="277" font-family="Inter-Medium" font-size="17" fill="#595959" text-anchor="middle">Ils travaillent la nuit, sur vos vrais comptes, et ne vous écrivent que quand il faut décider.</text><g id="Agents · trait haut" transform="translate(0 0)"><rect x="0" y="380" width="1440" height="1" fill="#D6D0C8"/></g><g id="Agents · trait milieu" transform="translate(0 0)"><rect x="720" y="380" width="1" height="620" fill="#D6D0C8"/></g><svg id="Agents · jointure g" x="146" y="376" width="8" height="8" overflow="visible"></svg><svg id="Agents · jointure m" x="716" y="376" width="8" height="8" overflow="visible"></svg><svg id="Agents · jointure d" x="1286" y="376" width="8" height="8" overflow="visible"></svg><svg id="Rapprochement · illustration" x="166" y="396" width="538" height="380" overflow="visible"><svg id="Rapprochement · ligne de banque" x="40" y="64" width="300" height="64" overflow="visible"><text id="Rapprochement · ligne · nom" x="20" y="27" font-family="Inter-SemiBold" font-size="14" fill="#1A1A1A" text-anchor="start">Leroy Merlin</text><text id="Rapprochement · ligne · détail" x="20" y="46" font-family="Inter-Medium" font-size="12" fill="#707070" text-anchor="start">Carte pro · 03 nov.</text><text id="Rapprochement · ligne · montant" x="280" y="36" font-family="Inter-SemiBold" font-size="14" fill="#1A1A1A" text-anchor="end">−84,20 €</text></svg><g id="Rapprochement · câble" transform="translate(0 0)"><path d="M190 134 C190 190 360 180 360 236" fill="none" stroke="#FFFFFF" stroke-width="1.5" transform="translate(0 1)"/><path d="M190 134 C190 190 36