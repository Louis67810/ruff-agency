16" fill="#595959" text-anchor="start">Chaque paiement retrouve sa facture, dans vos mails, votre Drive ou vos espaces fournisseurs.</text><svg id="Relance · illustration" x="736" y="396" width="538" height="380" overflow="visible"><svg id="Relance · message" x="69" y="72" width="400" height="156" overflow="visible"><svg id="Relance · message · agent" x="20" y="18" width="32" height="32" overflow="visible"><g id="Relance · message · agent · coche" transform="translate(8 8)"><path d="M4.5 8.2l2.3 2.3 4.7-4.9" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg><text id="Relance · message · de" x="64" y="31" font-family="Inter-SemiBold" font-size="14" fill="#1A1A1A" text-anchor="start">Agent Pointé à Marc</text><text id="Relance · message · canal" x="64" y="49" font-family="Inter-Medium" font-size="12" fill="#707070" text-anchor="start">Slack · 18 h 02</text><g id="Relance · message · trait" transform="translate(0 0)"><rect x="20" y="66" width="360" height="1" fill="#EFEBE7"/></g><text id="Relance · message · texte" x="20" y="96" font-family="Inter-Medium" font-size="14" fill="#262626" text-anchor="start">Il manque le ticket du déjeuner du 12 nov. (46,50 €). Tu peux me l'envoyer en photo ?</text></svg><svg id="Relance · Relance envoyée" x="184" y="252" width="170" height="34" overflow="visible"><svg id="Relance · Relance envoyée · coche" x="6" y="6" width="22" height="22" overflow="visible"><g id="Relance · Relance envoyée · coche · tracé" transform="translate(3 3)"><path d="M4.5 8.2l2.3 2.3 4.7-4.9" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg><text id="Relance · Relance envoyée · texte" x="36" y="21" font-family="Inter-Medium" font-size="14" fill="#FFFFFF" text-anchor="start">Relance envoyée</text></svg></svg><text id="Relance · titre" x="752" y="824" font-family="Inter-SemiBold" font-size="20" fill="#1A1A1A" text-anchor="start">La relance</text><text id="Relance · texte" x="752" y="856" font-family="Inter-Medium" font-size="16" fill="#595959" text-anchor="start">Un justificatif manque ? L'agent écrit à la bonne personne, au bon moment, et range la réponse.</text><g id="Agents · trait de fin" transform="translate(0 0)"><rect x="0" y="999" width="1440" height="1" fill="#D6D0C8"/></g><svg id="Agents · jointure 150" x="146" y="995.5" width="8" height="8" overflow="visible"></svg><svg id="Agents · jointure 1290" x="1286" y="995.5" width="8" height="8" overflow="visible"></svg><svg id="Agents · jointure 720" x="716" y="995.5" width="8" height="8" overflow="visible"></svg></svg>