<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020"><text id="Clôture · sur-titre" x="720" y="114" font-family="DMMono-Medium" font-size="14" fill="#3745F1" text-anchor="middle">LA CLÔTURE</text><text id="Clôture · titre" x="720" y="180" font-family="Inter-SemiBold" font-size="48" fill="#1A1A1A" text-anchor="middle">Le 5 du mois, tout est déjà chez votre comptable</text><text id="Clôture · intro" x="720" y="277" font-family="Inter-Medium" font-size="17" fill="#595959" text-anchor="middle">Pointé prépare l'export au format de votre cabinet et l'envoie dès que la dernière ligne est pointée.</text><svg id="Clôture · onglets" x="455" y="364" width="530" height="52" overflow="visible"><svg id="Clôture · onglet Rapprochement" x="6" y="6" width="152" height="40" overflow="visible"><text id="Clôture · onglet Rapprochement · texte" x="76.0" y="24" font-family="Inter-Medium" font-size="15" fill="#707070" text-anchor="middle">Rapprochement</text></svg><svg id="Clôture · onglet Relances" x="166" y="6" width="106" height="40" overflow="visible"><text id="Clôture · onglet Relances · texte" x="53.0" y="24" font-family="Inter-Medium" font-size="15" fill="#707070" text-anchor="middle">Relances</text></svg><svg id="Clôture · onglet TVA" x="280" y="6" width="70" height="40" overflow="visible"><text id="Clôture · onglet TVA · texte" x="35.0" y="24" font-family="Inter-Medium" font-size="15" fill="#707070" text-anchor="middle">TVA</text></svg><svg id="Clôture · onglet Export comptable" x="358" y="6" width="166" height="40" overflow="visible"><text id="Clôture · onglet Export comptable · texte" x="83.0" y="24" font-family="Inter-Medium" font-size="15" fill="#262626" text-anchor="middle">Export comptable</text></svg></svg><svg id="Clôture · carte" x="166" y="452" width="1108" height="500" overflow="visible"><svg id="Clôture · icône" x="40" y="44" width="32" height="32" overflow="visible"><g id="Clôture · icône · coche" transform="translate(8 8)"><path d="M4.5 8.2l2.3 2.3 4.7